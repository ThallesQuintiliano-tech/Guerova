<html lang="pt-BR">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sidebar-w: 252px;
      --sidebar: #1a2332;
      --sidebar-text: #94a3b8;
      --sidebar-active: #2563eb;
      --bg: #f0f2f5;
      --surface: #fff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(15,23,42,.06);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    .shell { display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .brand {
      padding: 1.1rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .brand strong { color: #fff; font-size: 1rem; display: block; }
    .brand small { font-size: .68rem; opacity: .75; }
    .nav { flex: 1; overflow-y: auto; padding: .4rem 0; }
    .nav-group { padding: .5rem 1rem .25rem; font-size: .65rem; text-transform: uppercase; letter-spacing: .08em; opacity: .5; }
    .nav-btn {
      display: flex; align-items: center; gap: .65rem;
      width: 100%; padding: .58rem 1rem;
      border: none; background: none; color: inherit;
      font: inherit; text-align: left; cursor: pointer;
      transition: background .12s, color .12s;
    }
    .nav-btn:hover { background: rgba(255,255,255,.06); color: #e2e8f0; }
    .nav-btn.active { background: var(--sidebar-active); color: #fff; font-weight: 600; }
    .nav-btn .ico { width: 20px; text-align: center; font-size: .95rem; }
    .sidebar-foot { padding: .75rem 1rem; font-size: .68rem; border-top: 1px solid rgba(255,255,255,.08); opacity: .6; }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: .65rem 1.25rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      box-shadow: var(--shadow);
    }
    .topbar h1 { font-size: .95rem; font-weight: 600; }
    .topbar-right { display: flex; align-items: center; gap: 1rem; font-size: .8rem; color: var(--muted); }
    .pill-demo { background: #fef3c7; color: #92400e; padding: .2rem .55rem; border-radius: 999px; font-size: .65rem; font-weight: 700; }
    .credits { font-variant-numeric: tabular-nums; }

    .viewport { flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem 2rem; }
    .view { display: none; animation: fade .2s ease; }
    .view.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* Components */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.15rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
    }
    .card-h { font-size: .82rem; font-weight: 700; margin-bottom: .75rem; color: var(--text); }
    .card-sub { font-size: .78rem; color: var(--muted); margin: -.5rem 0 .75rem; }

    .grid { display: grid; gap: 1rem; }
    .g2 { grid-template-columns: repeat(2, 1fr); }
    .g3 { grid-template-columns: repeat(3, 1fr); }
    .g4 { grid-template-columns: repeat(4, 1fr); }
    .g5 { grid-template-columns: repeat(5, 1fr); }
    @media (max-width: 1200px) { .g4, .g5 { grid-template-columns: repeat(2, 1fr); } .g3 { grid-template-columns: 1fr; } }
    @media (max-width: 768px) {
      .sidebar { width: 56px; }
      .brand span, .nav-btn span.lbl, .nav-group, .sidebar-foot { display: none; }
      .g2 { grid-template-columns: 1fr; }
    }

    .kpi .lbl { font-size: .65rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
    .kpi .val { font-size: 1.45rem; font-weight: 700; margin: .2rem 0; letter-spacing: -.02em; }
    .kpi .delta { font-size: .76rem; font-weight: 600; color: var(--success); }
    .kpi .delta.neu { color: var(--muted); }
    .kpi .delta.down { color: var(--danger); }

    .btn {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .48rem 1rem; border-radius: 999px; border: none;
      font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer;
      transition: background .12s, transform .08s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ghost { background: #fff; border: 1px solid var(--border); color: var(--text); }
    .btn-sm { padding: .32rem .65rem; font-size: .74rem; border-radius: 6px; }
    .btn-link { background: none; border: none; color: var(--primary); cursor: pointer; font: inherit; font-size: .82rem; padding: 0; }

    .tag { display: inline-block; padding: .12rem .45rem; border-radius: 999px; font-size: .65rem; font-weight: 700; }
    .tag-ok { background: #dcfce7; color: #166534; }
    .tag-warn { background: #fef3c7; color: #92400e; }
    .tag-muted { background: #f1f5f9; color: var(--muted); }
    .tag-blue { background: #dbeafe; color: #1d4ed8; }

    .alert { padding: .65rem .9rem; border-radius: 8px; font-size: .82rem; margin-bottom: 1rem; border: 1px solid; }
    .alert-info { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
    .alert-warn { background: #fffbeb; border-color: #fde68a; color: #92400e; }

    table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    th { text-align: left; font-size: .65rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: .5rem .55rem; border-bottom: 2px solid var(--border); white-space: nowrap; }
    td { padding: .52rem .55rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    tr:hover td { background: #f8fafc; }
    .tbl-wrap { overflow-x: auto; }

    .tabs { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: 1rem; }
    .tab {
      padding: .38rem .8rem; border-radius: 6px; border: 1px solid var(--border);
      background: #fff; font-size: .78rem; cursor: pointer; font-family: inherit;
    }
    .tab.on { background: var(--primary); color: #fff; border-color: var(--primary); }

    .field { margin-bottom: .8rem; }
    .field label { display: block; font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: .25rem; }
    .field input, .field select, .field textarea {
      width: 100%; padding: .45rem .6rem; border: 1px solid var(--border);
      border-radius: 6px; font: inherit; font-size: .84rem;
    }
    .field textarea { min-height: 72px; resize: vertical; }

    .hero { font-size: 1.65rem; font-weight: 700; line-height: 1.2; margin-bottom: .65rem; letter-spacing: -.02em; }
    .hero em { font-style: normal; color: var(--primary); }
    .muted { color: var(--muted); font-size: .88rem; }

    .listing-row { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: .35rem; }
    .listing { min-width: 270px; border-top: 4px solid var(--accent, var(--primary)); }

    .kanban { display: flex; gap: .7rem; overflow-x: auto; padding-bottom: .5rem; }
    .k-col { min-width: 210px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: .6rem; }
    .k-col h4 { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: .45rem; }
    .k-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: .6rem; margin-bottom: .45rem; font-size: .78rem; cursor: pointer; }
    .k-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }

    .wa { display: grid; grid-template-columns: 260px 1fr; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; min-height: 400px; background: #fff; }
    .wa-list { border-right: 1px solid var(--border); overflow-y: auto; }
    .wa-item { padding: .7rem .85rem; border-bottom: 1px solid #f1f5f9; cursor: pointer; font-size: .8rem; }
    .wa-item.on, .wa-item:hover { background: #eff6ff; }
    .wa-item .t { float: right; font-size: .68rem; color: var(--muted); }
    .wa-head { padding: .6rem 1rem; background: #075e54; color: #fff; font-size: .84rem; }
    .wa-msgs { padding: 1rem; background: #e5ddd5; min-height: 280px; display: flex; flex-direction: column; gap: .45rem; }
    .bubble { max-width: 78%; padding: .45rem .7rem; border-radius: 8px; font-size: .8rem; line-height: 1.4; }
    .bubble.out { align-self: flex-end; background: #dcf8c6; }
    .bubble.in { align-self: flex-start; background: #fff; }
    .wa-input { display: flex; gap: .5rem; padding: .6rem; border-top: 1px solid var(--border); }
    .wa-input input { flex: 1; border: 1px solid var(--border); border-radius: 999px; padding: .45rem .85rem; font: inherit; }

    .funnel-bar {

      color: #fff; border-radius: 6px; padding: .45rem .7rem;

    .chart-bars { display: flex; align-items: flex-end; gap: .55rem; height: 160px; }
    .chart-col { flex: 1; text-align: center; font-size: .68rem; color: var(--muted); }
    .chart-col .bar { width: 100%; max-width: 36px; margin: 0 auto .2rem; border-radius: 4px 4px 0 0; background: var(--primary); }
    .chart-col .bar.alt { background: #94a3b8; }

    .donut-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .donut { width: 110px; height: 110px; border-radius: 50%; flex-shrink: 0; }
    .donut-leg { list-style: none; font-size: .78rem; }
    .donut-leg li { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: .3rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: .35rem; }

    .map-br { display: grid; grid-template-columns: repeat(4, 1fr); gap: .35rem; max-width: 320px; }
    .map-uf {
      padding: .45rem; text-align: center; border-radius: 6px; font-size: .72rem; font-weight: 700; color: #fff;
    }

    .progress { height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .progress > div { height: 100%; background: linear-gradient(90deg, #1d4ed8, #3b82f6); border-radius: 999px; }

    .gauge-wrap { text-align: center; }
    .gauge {
      width: 130px; height: 130px; border-radius: 50%; margin: 0 auto;
      background: conic-gradient(var(--success) 0% 72%, #e2e8f0 72% 100%);
      display: flex; align-items: center; justify-content: center;
    }
    .gauge-in {
      width: 88px; height: 88px; background: #fff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; font-weight: 700; color: var(--success);
    }

    .loader { text-align: center; padding: 3rem 1rem; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: var(--primary);
      border-radius: 50%; margin: 0 auto 1rem; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .breadcrumb { font-size: .78rem; color: var(--muted); margin-bottom: 1rem; }
    .breadcrumb button { background: none; border: none; color: var(--primary); cursor: pointer; font: inherit; }

    .filters { display: flex; flex-wrap: wrap; gap: .75rem; align-items: flex-end; margin-bottom: 1rem; }
    .filters .field { margin: 0; min-width: 130px; }

    .state-bar { display: grid; grid-template-columns: 28px 1fr 72px; gap: .5rem; align-items: center; margin-bottom: .4rem; font-size: .78rem; }
    .state-bar .track { background: #f1f5f9; border-radius: 4px; height: 8px; overflow: hidden; }
    .state-bar .fill { height: 100%; background: var(--primary); border-radius: 4px; }

    .lead-tabs { display: flex; gap: .25rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: .5rem; }
    .lead-tab { padding: .35rem .75rem; border: none; background: none; font: inherit; font-size: .8rem; cursor: pointer; color: var(--muted); border-radius: 6px 6px 0 0; }
    .lead-tab.on { color: var(--primary); font-weight: 600; background: #eff6ff; }

    code { font-size: .85em; background: #f1f5f9; padding: .1rem .35rem; border-radius: 4px; }
  </style>
</head>

          <button type="button" class="btn btn-ghost btn-sm" id="wa-toggle">${waConnected ? 'Desconectar' : 'Mostrar QR Code'}</button>
        </div>
        ${!waConnected ? '<div class="alert alert-warn">Escaneie o QR no telemóvel: WhatsApp → Aparelhos conectados → Conectar aparelho.</div>' : ''}
        <div class="wa">
          <div class="wa-list">${D.wa.chats.map((c, i) => `
            <div class="wa-item${i === 0 ? ' on' : ''}"><span class="t">${c.time}</span><strong>${c.name}</strong><br>
            <span class="muted" style="font-size:.72rem">${c.last}</span></div>`).join('')}</div>
          <div>
            <div class="wa-head"><strong>João Silva</strong> · (11) 98765-4321</div>
            <div class="wa-msgs">${D.wa.thread.map(m => `<div class="bubble ${m.out ? 'out' : 'in'}">${m.txt}
              <div style="font-size:.62rem;color:var(--muted);text-align:right;margin-top:.15rem">${m.t}</div></div>`).join('')}</div>
            <div class="wa-input"><input placeholder="Digite uma mensagem…" ${waConnected ? '' : 'disabled'}>
              <button type="button" class="btn btn-primary btn-sm" ${waConnected ? '' : 'disabled'}>Enviar</button></div>
          </div>
        </div>
        <div class="card" style="margin-top:1rem">
          <div class="card-h">Nova conversa (Guerova)</div>
          <div class="grid g2"><div class="field"><label>Número (DDI+DDD)</label><input placeholder="5511999999999"></div>
          <div class="field"><label>Nome (opcional)</label><input placeholder="Nome do contacto"></div></div>
          <button type="button" class="btn btn-ghost btn-sm">Iniciar conversa</button>
        </div>`;
    },

    briefing() {
      return `
        <p class="muted" style="margin-bottom:1rem">Modelo campanha → conjunto → anúncio. Campos 19–21 gerados pela IA no passo seguinte.</p>
        <div class="card"><div class="card-h">Campanha</div>
          <div class="grid g2">
            <div class="field"><label>Objetivo</label><select><option>Engajamento: Conversas iniciadas pelo WhatsApp</option></select></div>
            <div class="field"><label>Nome da campanha</label><input value="Guaiãzes 2Q — Jun/2025"></div>
            <div class="field"><label>Estratégia de orçamento</label><select><option>Orçamento do conjunto de anúncios</option></select></div>
          </div>
        </div>
        <div class="card"><div class="card-h">Conjunto de anúncios</div>
          <div class="grid g2">
            <div class="field"><label>Nome do conjunto</label><input value="Guaiãzes — SP raio 15km"></div>
            <div class="field"><label>Destino</label><select><option>Destino de mensagens — WhatsApp Business</option></select></div>
            <div class="field"><label>Público-alvo</label><input value="Homens e mulheres, 25 a 55 anos"></div>
            <div class="field"><label>Geo</label><input value="São Paulo, SP — raio 15 km"></div>
            <div class="field"><label>Orçamento diário</label><input value="R$ 50,00 por dia"></div>
            <div class="field"><label>Posicionamentos</label><input value="Feed e Stories Instagram + Facebook" readonly></div>
          </div>
        </div>
        <div class="card"><div class="card-h">Anúncio / Imóvel</div>
          <div class="grid g2">
            <div class="field"><label>Nome do imóvel</label><input value="Apartamento 2 dorms — Guaiãzes"></div>
            <div class="field"><label>Faixa de preço</label><input value="R$ 289.000"></div>
            <div class="field" style="grid-column:1/-1"><label>Destaques</label><textarea>Condomínio com portaria 24h, garagem, lazer completo</textarea></div>
            <div class="field"><label>CTA</label><input value="Fale conosco" readonly></div>
            <div class="field"><label>Formato</label><select><option>Imagem ou vídeo</option><option>Carrossel</option></select></div>
          </div>
        </div>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap">
          <button type="button" class="btn btn-ghost" data-go="inicio">Voltar</button>
          <button type="button" class="btn btn-primary" data-go="gerando">Gerar textos e pacote com IA →</button>
        </div>`;
    },

    gerando() {
      return `
        <div class="loader">
          <div class="spinner"></div>
          <h2 style="font-size:1.1rem;margin-bottom:.5rem">Gerando pacote de campanha…</h2>
          <p class="muted" style="margin-bottom:1.25rem">Gemini 2.5 Flash · fallback mock se API indisponível</p>
          <ul style="list-style:none;max-width:360px;margin:0 auto;text-align:left;font-size:.85rem">
            ${D.gerandoSteps.map((s, i) => `<li style="padding:.4rem 0;border-bottom:1px solid var(--border);color:${i < 4 ? 'var(--success)' : 'var(--muted)'}">
              ${i < 4 ? '✓' : '◌'} ${s}</li>`).join('')}
          </ul>
          <button type="button" class="btn btn-primary" style="margin-top:1.5rem" data-go="pacote">Ver pacote gerado →</button>
        </div>`;
    },

    pacote() {
      const p = D.pack;
      return `
        <div class="breadcrumb"><button type="button" data-go="briefing">Briefing</button> → Pacote IA</div>
        <div class="alert alert-info">Pacote gerado (mock) · modelo <code>gemini-2.5-flash</code></div>
        <div class="grid g2">
          <div class="card"><div class="card-h">Textos do anúncio</div>
            <p style="font-size:.84rem;margin-bottom:.75rem"><strong>Primary A:</strong><br>${p.primary}</p>
            <p style="font-size:.84rem;margin-bottom:.75rem"><strong>Primary B:</strong><br>${p.primaryB}</p>
            <p style="font-size:.82rem"><strong>Headlines:</strong> ${p.headlines.join(' · ')}</p>
            <p style="font-size:.82rem;margin-top:.5rem"><strong>Descrições:</strong> ${p.desc.join(' · ')}</p>
          </div>
          <div class="card"><div class="card-h">WhatsApp follow-up</div>
            <p style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:.75rem;font-size:.84rem">${p.wa}</p>
            <div class="card-h" style="margin-top:1rem">Roteiro de vídeo</div>
            <ol style="font-size:.8rem;padding-left:1.2rem;color:var(--muted)">${p.video.map(v => '<li style="margin-bottom:.25rem">' + v + '</li>').join('')}</ol>
          </div>
        </div>
        <div class="card"><div class="card-h">Ideias de criativo</div>
          <ul style="font-size:.84rem;padding-left:1.2rem">${p.images.map(i => '<li>' + i + '</li>').join('')}</ul>
        </div>
        <div class="card"><div class="card-h">Checklist Meta Ads</div>
          <ul style="font-size:.82rem;padding-left:1.2rem;color:var(--muted)">${p.checklist.map(c => '<li style="margin-bottom:.25rem">' + c + '</li>').join('')}</ul>
        </div>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap">
          <button type="button" class="btn btn-primary">Publicar no Meta (PAUSED)</button>
          <button type="button" class="btn btn-ghost">Salvar no Guerova</button>
          <button type="button" class="btn btn-ghost" data-go="refinamento">Refinar textos →</button>
          <button type="button" class="btn btn-ghost" data-go="campanhas">Ver campanhas</button>
        </div>`;
    },

    refinamento() {
      return `
        <div class="breadcrumb"><button type="button" data-go="pacote">← Pacote</button></div>
        <p class="muted" style="margin-bottom:1rem">Ajuste manual dos textos antes de publicar ou salvar.</p>
        <div class="card">
          <div class="field"><label>Texto principal (variante A)</label>
            <textarea>${D.pack.primary}</textarea></div>
          <div class="field"><label>Título / Headline</label><input value="${D.pack.headlines[0]}"></div>
          <div class="field"><label>Follow-up WhatsApp</label><textarea>${D.pack.wa}</textarea></div>
          <button type="button" class="btn btn-primary">Aplicar alterações</button>
        </div>`;
    },

    scraping() {
      return `
        <div class="card">
          <div class="card-h">Extrair leads B2B</div>
          <div class="grid g3">
            <div class="field"><label>Fonte</label><select><option>OpenStreetMap</option><option>Google Places</option></select></div>
            <div class="field"><label>Cidade / Estado</label><input value="São Paulo, SP"></div>
            <div class="field"><label>Quantidade</label><input type="number" value="10"></div>
            <div class="field"><label>Setor</label><select><option>Imóveis</option><option>Construtoras</option></select></div>
          </div>
          <button type="button" class="btn btn-primary">Executar scraping</button>
        </div>
        <div class="card">
          <div class="card-h">Resultados · ${D.scraping.length} registos (mock)</div>
          <div class="tbl-wrap"><table>
            <thead><tr><th>Empresa</th><th>Cidade</th><th>Telefone</th><th>Endereço</th></tr></thead>
            <tbody>${D.scraping.map(r => `<tr><td><strong>${r.emp}</strong></td><td>${r.city}</td><td>${r.tel}</td><td>${r.addr}</td></tr>`).join('')}
            </tbody>
          </table></div>
          <button type="button" class="btn btn-ghost btn-sm" style="margin-top:.75rem">Exportar CSV</button>
        </div>
        <p class="muted" style="font-size:.78rem">Produção: jobs assíncronos, LGPD e opt-in antes de campanhas.</p>`;
    },

    score() {
      return `
        <div class="alert alert-warn"><strong>Modo mock.</strong> CPF exemplo: <code>39053344705</code> (bom), <code>11144477735</code> (médio), <code>52998224725</code> (fraco).</div>
        <div class="grid g2">
          <div class="card">
            <div class="card-h">Consulta Serasa Anti Fraud Scores</div>
            <div class="field"><label>CPF (11 dígitos)</label><input value="39053344705"></div>
            <button type="button" class="btn btn-primary">Consultar score</button>
          </div>
          <div class="card gauge-wrap">
            <div class="card-h">Resultado simulado</div>
            <div class="gauge"><div class="gauge-in">720</div></div>
            <p style="margin-top:.75rem"><strong>Score de crédito</strong> — Baixo risco</p>
            <p class="muted" style="font-size:.78rem">CPF 390.533.447-05 · enrichments mock</p>
          </div>
        </div>`;
    },

    admin() {
      return `
        <div class="grid g2" style="align-items:start">
          <div class="card">
            <div class="card-h">Criar usuário</div>
            <div class="field"><label>Nome</label><input placeholder="Nome completo"></div>
            <div class="field"><label>E-mail</label><input type="email" placeholder="email@empresa.com"></div>
            <div class="field"><label>Senha</label><input type="password"></div>
            <div class="field"><label><input type="checkbox"> System admin</label></div>
            <div class="field"><label>Conta</label><select><option>Four Imóveis</option></select></div>
            <button type="button" class="btn btn-primary">Criar usuário</button>
          </div>
          <div class="card">
            <div class="card-h">Usuários cadastrados</div>
            <table><thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th></tr></thead>
            <tbody>${D.users.map(u => `<tr><td><strong>${u.name}</strong>${u.sys ? ' <span class="tag tag-warn">admin</span>' : ''}</td>
              <td>${u.email}</td><td>${u.role}</td></tr>`).join('')}
            </tbody></table>
          </div>
        </div>`;
    },

    config() {
      return `
        <div class="card">
          <div class="card-h">Meta Ads (Marketing API)</div>
          <div class="grid g2">
            <div class="field"><label>Graph version</label><input value="v21.0" readonly></div>
            <div class="field"><label>Conta de anúncios</label><input value="act_1857209318456078" readonly></div>
            <div class="field"><label>Page ID</label><input value="1094861130375743" readonly></div>
            <div class="field"><label>Token</label><input type="password" value="EAA••••••••••••" readonly></div>
          </div>
          <div style="display:flex;gap:.5rem;margin-top:.5rem">
            <button type="button" class="btn btn-primary">Salvar conexão</button>
            <button type="button" class="btn btn-ghost">Testar publicação PAUSED</button>
          </div>
        </div>
        <div class="card">
          <div class="card-h">WhatsApp</div>
          <div class="grid g2">
            <div><span class="tag tag-ok">Bridge Web</span> <span class="muted" style="font-size:.8rem">http://127.0.0.1:3100</span></div>
            <div><span class="tag tag-ok">Cloud API</span> <span class="muted" style="font-size:.8rem">Token + Phone ID configurados</span></div>
          </div>
        </div>
        <div class="card">
          <div class="card-h">Gemini (IA campanhas)</div>
          <div class="field"><label>Modelo</label><input value="gemini-2.5-flash" readonly></div>
          <span class="tag tag-ok">API Key configurada</span> <span class="tag tag-muted">Fallback mock: on</span>
        </div>
        <div class="card">
          <div class="card-h">Google Ads (opcional)</div>
          <p class="muted" style="font-size:.84rem">OAuth desabilitado nesta demo. Flag <code>VITE_FEATURE_GOOGLE=true</code> reativa na app React.</p>
        </div>
        <div class="card">
          <div class="card-h">Serasa Score</div>
          <p class="muted" style="font-size:.84rem">Anti Fraud Scores · mock em desenvolvimento · <code>SERASA_SCORE_USE_MOCK=true</code></p>
        </div>`;
    },
  };

  function render() {
    document.getElementById('sidebar-nav').innerHTML = navHtml();
    document.getElementById('view-title').textContent = TITLES[page] || page;
    const fn = VIEWS[page];
    document.getElementById('viewport').innerHTML = fn ? fn() : '<p>Página não encontrada.</p>';
    bindEvents();
  }

  function go(id) {
    page = id;
    render();
    document.querySelector('.viewport').scrollTop = 0;
  }

  function bindEvents() {
    document.querySelectorAll('[data-go]').forEach(el => {
      el.addEventListener('click', () => go(el.getAttribute('data-go')));
    });
    document.querySelectorAll('[data-camp-tab]').forEach(el => {
      el.addEventListener('click', () => { campTab = el.getAttribute('data-camp-tab'); render(); });
    });
    document.querySelectorAll('[data-rank-tab]').forEach(el => {
      el.addEventListener('click', () => { rankTab = el.getAttribute('data-rank-tab'); render(); });
    });
    document.querySelectorAll('[data-lead-tab]').forEach(el => {
      el.addEventListener('click', () => { leadTab = el.getAttribute('data-lead-tab'); render(); });
    });
    document.querySelectorAll('[data-lead]').forEach(el => {
      el.addEventListener('click', () => { selectedLead = el.getAttribute('data-lead'); leadTab = 'geral'; page = 'lead'; render(); });
    });
    const wt = document.getElementById('wa-toggle');
    if (wt) wt.addEventListener('click', () => { waConnected = !waConnected; render(); });
  }

  render();
})();
  </script>
</body>
